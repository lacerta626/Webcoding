<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 웹문서</title>
    <!-- 스타일태그에 css를 코딩하여 내부문서에 스타일적용 -->
     <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Pretendard", sans-serif;
            line-height: 1.6;
            padding: 20px;
            color: #3d2323;
        }
        
        .content{
            background-image: url('images/bg1.jpg');
            background-repeat: no-repeat;
            padding: 15px;
            margin-bottom: 20px;
        }
        div.image{
            background-color: #b6d3fa;
            padding: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: red;
        }

        h2 {
            color: orange;
        }

        h3 {
            color: rgb(144, 144, 5);
            background-color: #3dfab5;
            padding: 15px;
            margin-bottom: 20px;
        }
     </style>
</head>

<body>
    <div class ="content">
        <h1><strong>레드향</strong></h1>
        <p>껍질에 붉은 빛이 돌아 레드향이라 불린다.</p>
        <p>레드향은 <strong>감귤류 과일로, 주로 한국과 일본에서 재배된다.</strong> 이 과일은 달콤하고 상큼한 맛으로 유명하며, 비타민 C가 풍부하다.</p>
        <p>레드향은 껍질이 두껍고 손으로 쉽게 벗길 수 있으며, 과육은 부드럽고 즙이 많아 먹기 좋다.<br> 주로 생과일로 섭취되며, 주스나 디저트로도 활용된다.</p>
        <p>레드향은 겨울철에 제철을 맞아 더욱 맛있게 즐길 수 있다.</p>
    </div>
    <div class="image">
        <h2>이미지</h2>
        <p><img src="images/house01.png" alt="이미지"></p>
        <p><img src="images/house02.png" alt="이미지"></p>
        <p><img src="images/house03.png" alt="이미지"></p>
    </div>
    <div>
        <h3>배너</h3>
        <p>
            <img src="images/main_premium01.jpg" width="150px" alt="프리미엄">
            <img src="images/main_premium02.jpg" width="200px" alt="프리미엄">
            <img src="images/main_premium03.jpg" width="300px" alt="프리미엄">
        </p>


    </div>

</body>

</html>
